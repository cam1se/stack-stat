[workspace]
resolver = "3"
members = ["crates/stack-stat-core", "crates/stack-stat-tui"]
default-members = ["crates/stack-stat-tui"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = "1"
percent-encoding = "2"
ratatui = "0.30"
tui-piechart = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self-replace = "1"
sha2 = "0.10"
tar = "0.4"
tachyonfx = { version = "0.25", default-features = false, features = ["std"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_mut = "warn"

[workspace.lints.clippy]
debug_assert_with_mut_call = "warn"
