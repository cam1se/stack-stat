site_name: stack-stat
site_url: https://tcamise-gpsw.github.io/stack-stat/
site_description: Status for GitHub stacked pull requests in the terminal.
repo_name: tcamise-gpsw/stack-stat
repo_url: https://github.com/tcamise-gpsw/stack-stat
edit_uri: edit/main/docs/user/
docs_dir: docs/user
site_dir: site
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: fontawesome/solid/sun
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: fontawesome/solid/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: fontawesome/solid/moon
        name: Switch to system preference
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Configuration: configuration.md
  - Local checks: local-checks.md
  - Troubleshooting: troubleshooting.md
