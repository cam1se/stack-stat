name: release-stack-stat

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to build and publish
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: stack-stat
  CRATE_NAME: stack-stat-tui

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF##*/}}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'error: expected a stable vX.Y.Z tag' >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ver.outputs.tag }}
      - name: Check workspace version
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="stack-stat-tui") | .version')
          [[ "$CARGO_VERSION" == "$VERSION" ]] || { echo "error: tag $VERSION != package $CARGO_VERSION" >&2; exit 1; }

  rust-gate:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked --no-fail-fast

  build:
    needs: [prepare, rust-gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: aarch64-apple-darwin, runner: macos-latest, cross: false, archive: tar.gz}
          - {target: x86_64-apple-darwin, runner: macos-latest, cross: false, archive: tar.gz}
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, cross: false, archive: tar.gz}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-latest, cross: true, archive: tar.gz}
          - {target: x86_64-pc-windows-msvc, runner: windows-latest, cross: false, archive: zip}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build binary
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == 'true' ]]; then
            cross build --release --locked -p "$CRATE_NAME" --target '${{ matrix.target }}'
          else
            cargo build --release --locked -p "$CRATE_NAME" --target '${{ matrix.target }}'
          fi
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING="${BINARY_NAME}-${VERSION}-${{ matrix.target }}"
          mkdir "$STAGING"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "$STAGING/"
          cp LICENSE README.md "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          echo "ARCHIVE=${STAGING}.tar.gz" >> "$GITHUB_ENV"
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "$env:BINARY_NAME-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/$env:BINARY_NAME.exe" "$staging/"
          Copy-Item LICENSE, README.md "$staging/"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "ARCHIVE=$staging.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        shell: bash
        run: sha256sum ./* | sed 's|  \./|  |' > checksums.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ needs.prepare.outputs.tag }}' dist/* --repo '${{ github.repository }}' --clobber
