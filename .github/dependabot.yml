version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [cam1se]
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      stack-stat-prod:
        dependency-type: production
      stack-stat-dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [cam1se]
    groups:
      github-actions:
        patterns: ["*"]
