version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [tcamise-gpsw]
    groups:
      stack-stat-prod:
        dependency-type: production
      stack-stat-dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: [tcamise-gpsw]
    groups:
      github-actions:
        patterns: ["*"]
